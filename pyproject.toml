[project]
name = "gds-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
# Run from the repo root so `import core` works, the same way the apps import it.
pythonpath = ["."]
testpaths = ["tests"]
